<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="100%" height="100%" fill="none">
  <defs>
    <!-- Professional Multi-Stop Metallic Purple Gradient -->
    <linearGradient id="brandFullPurple" x1="120" y1="60" x2="445" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="18%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="90%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Subtle Bevel Rim Light Gradient -->
    <linearGradient id="logoRimLight" x1="120" y1="60" x2="445" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#d8b4fe" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Natural Ambient Soft Shadow -->
    <filter id="naturalLogoDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 
    THE OFFICIAL BREDARIOL CYBER "B" MONOGRAM 
    Centered horizontally at X=300 (offset by +17.5px from X=282.5)
  -->
  <g id="official-monogram" filter="url(#naturalLogoDepth)" transform="translate(18, -30)">
    <!-- 1. UPPER SECTION -->
    <path
      fill="url(#brandFullPurple)"
      stroke="url(#logoRimLight)"
      stroke-width="1.5"
      stroke-linejoin="round"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 120 80
        H 330
        C 400 80, 435 115, 435 160
        C 435 205, 400 240, 330 240
        H 190
        L 120 310
        V 80
        Z
        M 190 135
        H 320
        C 345 135, 360 145, 360 160
        C 360 175, 345 185, 320 185
        H 190
        V 135
        Z
      "
    />

    <!-- 2. MIDDLE FORWARD-SLASH BAR -->
    <polygon
      points="120,390 120,330 250,200 310,200"
      fill="url(#brandFullPurple)"
      stroke="url(#logoRimLight)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- 3. LOWER SECTION -->
    <path
      fill="url(#brandFullPurple)"
      stroke="url(#logoRimLight)"
      stroke-width="1.5"
      stroke-linejoin="round"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 120 410
        L 270 260
        H 340
        C 410 260, 445 295, 445 360
        C 445 425, 410 460, 340 460
        H 170
        L 120 410
        Z
        M 200 315
        H 335
        C 365 315, 380 335, 380 360
        C 380 385, 365 405, 335 405
        H 200
        V 315
        Z
      "
    />
  </g>

  <!-- BRAND TYPOGRAPHY: BREDɅRIOL -->
  <g id="brand-typography">
    <text
      x="300"
      y="470"
      text-anchor="middle"
      fill="#ffffff"
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="800"
      font-size="52"
      letter-spacing="10"
    >BREDɅRIOL</text>
  </g>

  <!-- SUBTITLE: — DIGITAL — -->
  <g id="brand-subtitle">
    <line x1="130" y1="515" x2="225" y2="515" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <text
      x="300"
      y="521"
      text-anchor="middle"
      fill="#a855f7"
      font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="700"
      font-size="19"
      letter-spacing="14"
    >DIGITAL</text>
    <line x1="375" y1="515" x2="470" y2="515" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
