<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="100%" height="100%" fill="none">
  <!-- Deep rich black background -->
  <rect width="600" height="560" fill="#030106"/>

  <defs>
    <!-- Master Violet-to-Deep-Purple Gradient -->
    <linearGradient id="brdMainGrad" x1="52" y1="36" x2="276" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="18%" stop-color="#c084fc" />
      <stop offset="48%" stop-color="#9333ea" />
      <stop offset="78%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Left Spine Luster Gradient -->
    <linearGradient id="brdSpineGrad" x1="52" y1="36" x2="106" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="22%" stop-color="#c084fc" />
      <stop offset="65%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Cyber Diagonal Light Blade -->
    <linearGradient id="brdBladeGrad" x1="40" y1="260" x2="240" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#f0abfc" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Top Shoulder Specular Sheen -->
    <linearGradient id="brdSheenGrad" x1="52" y1="36" x2="220" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#f5d0fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Outer Neon Glow -->
    <filter id="brdNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Ambient Atmosphere -->
    <radialGradient id="brdRadialAtmosphere" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#581c87" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030106" stop-opacity="0" />
    </radialGradient>

    <!-- Exact Silhouette Clip Path -->
    <clipPath id="brdSilhouetteClip">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="
          M 66 36
          H 186
          C 236 36 264 64 264 106
          C 264 140 238 164 196 170
          C 246 176 274 204 274 252
          C 274 298 238 332 188 332
          H 66
          C 58 332 52 326 52 318
          V 50
          C 52 42 58 36 66 36
          Z
          M 106 84
          H 180
          C 204 84 216 94 216 106
          C 216 118 204 128 180 128
          H 106
          V 84
          Z
          M 106 196
          H 184
          C 212 196 226 210 226 252
          C 226 270 212 284 184 284
          H 106
          V 196
          Z
        "
      />
    </clipPath>
  </defs>

  <!-- Ambient Light Behind Monogram -->
  <circle cx="300" cy="180" r="200" fill="url(#brdRadialAtmosphere)" />

  <!-- ==================== THE 'B' MONOGRAM ==================== -->
  <g id="bredariol-monogram" transform="translate(164, 25) scale(0.85)" filter="url(#brdNeonGlow)">
    <!-- Solid Silhouette -->
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="
        M 66 36
        H 186
        C 236 36 264 64 264 106
        C 264 140 238 164 196 170
        C 246 176 274 204 274 252
        C 274 298 238 332 188 332
        H 66
        C 58 332 52 326 52 318
        V 50
        C 52 42 58 36 66 36
        Z
        M 106 84
        H 180
        C 204 84 216 94 216 106
        C 216 118 204 128 180 128
        H 106
        V 84
        Z
        M 106 196
        H 184
        C 212 196 226 210 226 252
        C 226 270 212 284 184 284
        H 106
        V 196
        Z
      "
      fill="url(#brdMainGrad)"
    />

    <!-- Clipped Internal Facets & Cyber Blade -->
    <g clip-path="url(#brdSilhouetteClip)">
      <rect x="52" y="36" width="54" height="296" fill="url(#brdSpineGrad)" opacity="0.6" />
      <line x1="106" y1="36" x2="106" y2="332" stroke="#e9d5ff" stroke-opacity="0.25" stroke-width="1.5" />
      <polygon points="20,290 190,120 230,120 60,290" fill="url(#brdBladeGrad)" />
      <path d="M 52 36 H 186 C 230 36 256 60 262 96 C 252 52 224 40 184 40 H 52 Z" fill="url(#brdSheenGrad)" />
      <line x1="106" y1="170" x2="196" y2="170" stroke="#f5d0fe" stroke-opacity="0.45" stroke-width="2" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- "BREDARIOL" - Crisp White, Bold, Wide Tracking -->
  <text 
    x="300" 
    y="440" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" 
    font-size="42" 
    font-weight="800" 
    letter-spacing="9"
  >BREDARIOL</text>

  <!-- Subtitle Group: — DIGITAL — -->
  <g transform="translate(300, 484)">
    <line x1="-185" y1="-6" x2="-75" y2="-6" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
    <text 
      x="0" 
      y="0" 
      text-anchor="middle" 
      fill="#c084fc" 
      font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" 
      font-size="19" 
      font-weight="700" 
      letter-spacing="14"
    >DIGITAL</text>
    <line x1="75" y1="-6" x2="185" y2="-6" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>