<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="100%" height="100%" fill="none">
  <defs>
    <!-- Professional Multi-Stop Metallic Purple Gradient -->
    <linearGradient id="cyberBredariolGrad" x1="120" y1="80" x2="445" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="18%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="90%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Subtle Bevel Rim Light Gradient -->
    <linearGradient id="rimLightGrad" x1="120" y1="80" x2="445" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#d8b4fe" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Natural Ambient Soft Shadow (No fake blur glow) -->
    <filter id="naturalDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Group with Natural Ambient Shadow -->
  <g id="official-b-monogram" filter="url(#naturalDepth)">

    <!-- 1. UPPER SECTION: Upper Lobe + Precise 45° Waist Cut + Counter Hole -->
    <path
      fill="url(#cyberBredariolGrad)"
      stroke="url(#rimLightGrad)"
      stroke-width="1.5"
      stroke-linejoin="round"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 120 80
        H 330
        C 400 80, 435 115, 435 160
        C 435 205, 400 240, 330 240
        H 190
        L 120 310
        V 80
        Z
        M 190 135
        H 320
        C 345 135, 360 145, 360 160
        C 360 175, 345 185, 320 185
        H 190
        V 135
        Z
      "
    />

    <!-- 2. MIDDLE FORWARD-SLASH BAR: Perfect 45° Cyber Chevron (Zero Distortion) -->
    <polygon
      points="120,390 120,330 250,200 310,200"
      fill="url(#cyberBredariolGrad)"
      stroke="url(#rimLightGrad)"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- 3. LOWER SECTION: Lower Lobe + Precise 45° Chamfered Base + Counter Hole -->
    <path
      fill="url(#cyberBredariolGrad)"
      stroke="url(#rimLightGrad)"
      stroke-width="1.5"
      stroke-linejoin="round"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M 120 410
        L 270 260
        H 340
        C 410 260, 445 295, 445 360
        C 445 425, 410 460, 340 460
        H 170
        L 120 410
        Z
        M 200 315
        H 335
        C 365 315, 380 335, 380 360
        C 380 385, 365 405, 335 405
        H 200
        V 315
        Z
      "
    />

  </g>
</svg>
