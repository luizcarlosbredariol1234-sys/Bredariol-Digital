<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050d24"/>
      <stop offset="25%" stop-color="#081438"/>
      <stop offset="65%" stop-color="#0b1e4f"/>
      <stop offset="100%" stop-color="#06122d"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2766" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#08173d" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1100" fill="url(#bgGrad)"/>

  <!-- High-Tech Engineering Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="0" y1="900" x2="800" y2="900"/>
    <line x1="0" y1="1000" x2="800" y2="1000"/>
    <line x1="100" y1="0" x2="100" y2="1100"/>
    <line x1="200" y1="0" x2="200" y2="1100"/>
    <line x1="300" y1="0" x2="300" y2="1100"/>
    <line x1="400" y1="0" x2="400" y2="1100"/>
    <line x1="500" y1="0" x2="500" y2="1100"/>
    <line x1="600" y1="0" x2="600" y2="1100"/>
    <line x1="700" y1="0" x2="700" y2="1100"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="220" r="180" fill="#0284c7" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="120" cy="540" r="160" fill="#38bdf8" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="700" cy="850" r="200" fill="#0ea5e9" opacity="0.15" filter="url(#softGlow)"/>

  <!-- TOP BAR: Horário Comercial & Telefone -->
  <rect x="0" y="0" width="800" height="42" fill="#030816" border-bottom="1px solid #1e293b"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e3a8a" stroke-opacity="0.4"/>
  
  <!-- Clock Icon -->
  <circle cx="48" cy="21" r="7" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <polyline points="48,17 48,21 52,23" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <text x="64" y="25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
    Horário Comercial: Seg a Sex, 07h às 17h
  </text>

  <!-- WhatsApp / Phone Icon & Number -->
  <g transform="translate(580, 14)">
    <circle cx="10" cy="7" r="7" fill="#10b981" opacity="0.2"/>
    <path d="M7 4 C5 4 4 5 4 7 C4 10 7 13 10 13 C12 13 13 12 13 10 L11.5 9 L10 10 C9 9.5 8.5 9 8 8 L9 7 L8 5.5 Z" fill="#10b981"/>
    <text x="24" y="11" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">
      (14) 98134-6255
    </text>
  </g>

  <!-- HEADER / NAVBAR -->
  <rect x="0" y="42" width="800" height="84" fill="#06122d" opacity="0.95"/>
  <line x1="0" y1="126" x2="800" y2="126" stroke="#1d4ed8" stroke-opacity="0.3"/>

  <!-- KRM Brand Logo -->
  <g transform="translate(48, 56)">
    <!-- Blue Hexagon / Tech Shield -->
    <polygon points="24,0 48,14 48,42 24,56 0,42 0,14" fill="url(#cyanGrad)" opacity="0.95"/>
    <polygon points="24,6 42,17 42,39 24,50 6,39 6,17" fill="#06122d"/>
    <!-- Snowflake & Bolt Symbol -->
    <path d="M24,14 L24,42 M14,24 L34,32 M14,32 L34,24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Brand Title -->
    <text x="62" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="1">
      KRM
    </text>
    <text x="62" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">
      REFRIGERAÇÃO, ELÉTRICA &amp; PLACA SOLAR
    </text>
    <text x="62" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500">
      Kleison Rogério • Chavantes - SP e Região
    </text>
  </g>

  <!-- Header Right CTA: WhatsApp -->
  <rect x="620" y="66" width="132" height="36" rx="18" fill="url(#btnGrad)" filter="url(#boxShadow)"/>
  <text x="686" y="89" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    FALE CONOSCO
  </text>

  <!-- HERO SECTION -->

  <!-- Top Badge -->
  <g transform="translate(48, 160)">
    <rect width="360" height="30" rx="15" fill="#0c2358" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8"/>
    <text x="30" y="20" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">
      ENGENHARIA &amp; CLIMATIZAÇÃO DE PRECISÃO
    </text>
  </g>

  <!-- Big Hero Headline -->
  <text x="48" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" line-height="1.1">
    Engenharia e
  </text>
  <text x="48" y="292" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">
    climatização de
  </text>
  <text x="48" y="344" fill="url(#cyanGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900">
    precisão milimétrica.
  </text>

  <!-- Subheadline -->
  <text x="48" y="390" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    Sistemas solares com até 95% de redução na conta de energia, instalação
  </text>
  <text x="48" y="414" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
    no rigoroso padrão de fábrica e adequação elétrica NBR 5410.
  </text>

  <!-- Green Big CTA Button -->
  <g transform="translate(48, 445)">
    <rect width="380" height="54" rx="27" fill="url(#btnGrad)" filter="url(#boxShadow)"/>
    <circle cx="36" cy="27" r="14" fill="#047857"/>
    <path d="M31 22 C29 22 28 23 28 25 C28 28 31 31 34 31 C36 31 37 30 37 28 L35.5 27 L34 28 C33 27.5 32.5 27 32 26 L33 25 L32 23.5 Z" fill="#ffffff"/>
    <text x="210" y="33" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      SOLICITAR ORÇAMENTO NO WHATSAPP
    </text>
  </g>

  <!-- 3 METRIC CARDS ROW -->
  <g transform="translate(48, 525)">
    <!-- Card 1: Solar -->
    <rect x="0" y="0" width="224" height="110" rx="16" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1.2" filter="url(#boxShadow)"/>
    <text x="20" y="42" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">
      Até 95%
    </text>
    <text x="20" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      Economia Solar
    </text>
    <text x="20" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">
      Homologação Rápida
    </text>

    <!-- Card 2: Clima -->
    <rect x="240" y="0" width="224" height="110" rx="16" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1.2" filter="url(#boxShadow)"/>
    <text x="260" y="42" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">
      &lt; 500µ
    </text>
    <text x="260" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      Vácuo Absoluto
    </text>
    <text x="260" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">
      Padrão de Fábrica
    </text>

    <!-- Card 3: Elétrica -->
    <rect x="480" y="0" width="224" height="110" rx="16" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1.2" filter="url(#boxShadow)"/>
    <text x="500" y="42" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900">
      NBR 5410
    </text>
    <text x="500" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
      Engenharia Elétrica
    </text>
    <text x="500" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">
      Segurança Certificada
    </text>
  </g>

  <!-- SERVICES FEATURE SHOWCASE -->
  <g transform="translate(48, 660)">
    <rect width="704" height="380" rx="24" fill="#07153d" stroke="#1e40af" stroke-width="1.5" filter="url(#boxShadow)"/>

    <!-- Section Title -->
    <text x="32" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">
      Nossas Especialidades Técnicas
    </text>
    <text x="32" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      Atendemos residências de alto padrão, indústrias e comércios em Chavantes e toda região.
    </text>

    <!-- Service 1: Energia Solar -->
    <g transform="translate(32, 95)">
      <rect width="310" height="120" rx="14" fill="#0a1d52" stroke="#2563eb" stroke-opacity="0.4"/>
      <!-- Sun / Panel Icon -->
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#d97706" opacity="0.2"/>
      <polygon points="30,50 50,50 46,26 34,26" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <line x1="40" y1="26" x2="40" y2="50" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="32" y1="38" x2="48" y2="38" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">
        Energia Solar Fotovoltaica
      </text>
      <text x="72" y="54" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        Homologação e Instalação
      </text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Projeto completo com painéis tier 1 e microinversores de máxima eficiência.
      </text>
    </g>

    <!-- Service 2: Climatização -->
    <g transform="translate(362, 95)">
      <rect width="310" height="120" rx="14" fill="#0a1d52" stroke="#2563eb" stroke-opacity="0.4"/>
      <!-- AC Snowflake Icon -->
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#0284c7" opacity="0.2"/>
      <path d="M40,26 L40,54 M26,40 L54,40 M30,30 L50,50 M30,50 L50,30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">
        Climatização Inverter
      </text>
      <text x="72" y="54" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        Padrão Rigoroso de Fábrica
      </text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Gás R32/R410, isolamento térmico blindado e teste de estanqueidade com N2.
      </text>
    </g>

    <!-- Service 3: Elétrica NBR 5410 -->
    <g transform="translate(32, 235)">
      <rect width="310" height="120" rx="14" fill="#0a1d52" stroke="#2563eb" stroke-opacity="0.4"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#10b981" opacity="0.2"/>
      <polygon points="42,24 32,38 38,38 34,54 48,36 40,36" fill="#10b981"/>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">
        Instalações Elétricas
      </text>
      <text x="72" y="54" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        Conformidade NBR 5410
      </text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Quadros de distribuição, DPS, DR, balanceamento de fases e laudos.
      </text>
    </g>

    <!-- Service 4: Iluminação & LED -->
    <g transform="translate(362, 235)">
      <rect width="310" height="120" rx="14" fill="#0a1d52" stroke="#2563eb" stroke-opacity="0.4"/>
      <rect x="20" y="20" width="40" height="40" rx="10" fill="#a855f7" opacity="0.2"/>
      <circle cx="40" cy="38" r="10" stroke="#c084fc" stroke-width="2" fill="none"/>
      <line x1="40" y1="24" x2="40" y2="21" stroke="#c084fc" stroke-width="2"/>
      <line x1="40" y1="52" x2="40" y2="55" stroke="#c084fc" stroke-width="2"/>
      <line x1="26" y1="38" x2="23" y2="38" stroke="#c084fc" stroke-width="2"/>
      <line x1="54" y1="38" x2="57" y2="38" stroke="#c084fc" stroke-width="2"/>
      <text x="72" y="36" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">
        Perfis &amp; Fitas de LED
      </text>
      <text x="72" y="54" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
        Projetos Luminotécnicos
      </text>
      <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">
        Iluminação indireta moderna em gesso, marcenaria e fachadas arquitetônicas.
      </text>
    </g>
  </g>

  <!-- Verified Seal at Bottom -->
  <g transform="translate(48, 1055)">
    <text x="0" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">
      Desenvolvido por Bredariol Digital® • Performance 100/100 Google PageSpeed
    </text>
  </g>
</svg>
